# docker-compose.ci.yaml — Ephemeral CI Stack
# Optimized for speed (tmpfs), reliability (healthchecks), and determinism.
# Usage: docker compose -f docker-compose.ci.yaml up -d --wait
#
# Post-cutover shape (Phase 6 §E): the hub owns migrations, seeding, the API,
# SSE and the SPA. Caddy is the front door on :8085 — its healthcheck doubles
# as the hub's (the distroless hub image has no shell for an in-container one).

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upsilon
    volumes:
      # Per-service databases (upsilon, upsilonauth, upsiloneconomy); CI stacks are
      # always fresh, so the initdb scripts run on every `up`.
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  hub-migrate:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    command: [ "-migrate-mode", "full" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  hub-seed:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    command: [ "-seed" ]
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
    env_file:
      - .env # ADMIN_INITIAL_PASSWORD gates the admin seed block
    depends_on:
      hub-migrate:
        condition: service_completed_successfully

  hub:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/upsilon?sslmode=disable
      # Exception-prefix parity ("-- DEBUG MODE -- ") — the CLI edge suites
      # assert it, matching Laravel's testing env.
      - APP_DEBUG=true
      - UPSILON_API_URL=http://engine:8081
      - UPSILON_WEBHOOK_URL=http://proxy:8085/api/webhook/upsilon
    depends_on:
      hub-seed:
        condition: service_completed_successfully

  proxy:
    image: caddy:2-alpine
    environment:
      - HUB_UPSTREAM=hub:8090
    volumes:
      - ./upsilonhub/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8085:8085"
    depends_on:
      - hub
    healthcheck:
      # Proves the whole chain: proxy → hub → /up liveness route.
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/up" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  engine:
    build:
      context: .
      dockerfile: ./upsilonapi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  tester:
    build:
      context: .
      dockerfile: ./upsiloncli/Dockerfile
    environment:
      - UPSILON_BASE_URL=http://proxy:8085
      - UPSILON_CLI_PATH=upsiloncli
    volumes:
      - ./upsiloncli/samples:/app/upsiloncli/samples
      - ./upsiloncli/tests:/app/upsiloncli/tests
      - ./upsiloncli/internal:/app/upsiloncli/internal
    depends_on:
      proxy:
        condition: service_healthy
      engine:
        condition: service_healthy
