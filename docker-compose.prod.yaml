# docker-compose.prod.yaml — Production Stack
# Built for persistence, reliability, and automated orchestration.
# Usage: ./scripts/setup_prod.sh && docker compose -f docker-compose.prod.yaml up -d --wait
#
# Post-cutover shape (Phase 6 §E): one hub image serves the API, SSE and the
# SPA; db-init runs -migrate-mode full against a fresh database (the old prod DB
# is wiped, not adopted — decision 2026-07-09), applying 000001 + 000002+ from
# scratch. Caddy stays the front door, publishing the historical client port
# 8000 — its healthcheck doubles as the hub's (the distroless hub image has no
# shell for an in-container one).
#
# NOTE: -migrate-mode baseline (adopt a Laravel-migrated DB, stamp 000001 as
# already-applied) is intentionally NOT used here — it would mark 000001 as
# applied *without running it* on an empty DB, then 000002 would ALTER a table
# that was never created. Only use baseline against a DB that already carries
# the Laravel schema. The adoption/cutover runbook is preserved in
# architecture/prod_cutover_runbook.md for reference.

name: upsilon-prod

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upsilon
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    volumes:
      - db_data:/var/lib/postgresql

  db-init:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    command: [ "-migrate-mode", "full" ]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  hub:
    build:
      context: .
      dockerfile: ./upsilonhub/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env

  proxy:
    image: caddy:2-alpine
    environment:
      - HUB_UPSTREAM=hub:8090
    volumes:
      - ./upsilonhub/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8000:8085"
    depends_on:
      - hub
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/up" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  engine:
    build:
      context: .
      dockerfile: ./upsilonapi/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  cli:
    build:
      context: .
      dockerfile: ./upsiloncli/Dockerfile
    depends_on:
      proxy:
        condition: service_healthy
      engine:
        condition: service_healthy
    env_file:
      - .env
    command: tail -f /dev/null

volumes:
  db_data:
